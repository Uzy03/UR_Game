<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b9d9e8" />
    <title>Anniversary Game — Phase 3</title>
  </head>
  <body>
    <main id="app" aria-label="3D game"></main>
    <section id="task-hud" class="task-hud" aria-live="polite" hidden>
      <div data-task-label></div>
      <div data-task-timer></div>
    </section>
    <div id="interaction-prompt" class="interaction-prompt" role="status" hidden></div>
    <div id="speech-bubble" class="speech-bubble" role="status" hidden></div>
    <section id="dialogue-window" class="dialogue-window" aria-live="polite" hidden>
      <div class="dialogue-speaker" data-dialogue-speaker></div>
      <div class="dialogue-text" data-dialogue-text></div>
      <div class="dialogue-next">E / Space : Next</div>
    </section>
    <section id="result-overlay" class="result-overlay" aria-live="assertive" hidden>
      <div class="result-title" data-result-title></div>
      <div class="result-retry" data-result-retry></div>
    </section>
    <div class="controls" aria-hidden="true">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move&nbsp;&nbsp;<kbd>E</kbd> / <kbd>Space</kbd> Action
    </div>
    <noscript>このゲームを実行するにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
