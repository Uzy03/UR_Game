<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b9d9e8" />
    <title>Anniversary Game — Phase 15</title>
  </head>
  <body>
    <main id="app" aria-label="3D game"></main>
    <button
      id="audio-mute"
      class="audio-mute"
      type="button"
      aria-pressed="false"
      aria-label="Turn sound off"
    >Sound On</button>
    <section id="start-menu" class="start-menu">
      <div class="start-menu-panel" role="dialog" aria-modal="true" aria-labelledby="start-menu-title">
        <p class="start-menu-phase">Phase 15 Campaign</p>
        <h1 id="start-menu-title">Anniversary Game</h1>
        <p class="start-menu-description">Play a campaign that connects every story and gameplay system.</p>
        <div class="start-menu-actions">
          <button type="button" class="start-menu-primary" data-start-new>New Game</button>
          <button type="button" data-start-continue disabled>Continue</button>
          <button type="button" class="start-menu-reset" data-start-reset hidden>Reset Progress</button>
        </div>
        <p class="start-menu-status" data-start-status role="status" aria-live="polite"></p>
      </div>
    </section>
    <section
      id="transition-overlay"
      class="transition-overlay"
      role="status"
      aria-live="polite"
      aria-hidden="true"
      hidden
    >
      <div class="transition-card">
        <p class="transition-eyebrow" data-transition-eyebrow></p>
        <h2 class="transition-title" data-transition-title></h2>
        <p class="transition-subtitle" data-transition-subtitle></p>
      </div>
    </section>
    <section id="task-hud" class="task-hud" aria-live="polite" hidden>
      <div data-task-label></div>
      <div data-task-timer></div>
    </section>
    <div id="interaction-prompt" class="interaction-prompt" role="status" hidden></div>
    <div id="speech-bubble" class="speech-bubble" role="status" hidden></div>
    <section id="dialogue-window" class="dialogue-window" aria-live="polite" hidden>
      <div class="dialogue-speaker" data-dialogue-speaker></div>
      <div class="dialogue-text" data-dialogue-text></div>
      <div class="dialogue-next">E / Space : Next</div>
    </section>
    <section id="result-overlay" class="result-overlay" aria-live="assertive" hidden>
      <div class="result-title" data-result-title></div>
      <div class="result-retry" data-result-retry></div>
    </section>
    <section id="phone-overlay" class="phone-overlay" hidden>
      <div class="phone-shell" role="dialog" aria-modal="true" aria-label="Game phone">
        <header class="phone-header">
          <button type="button" class="phone-header-button" data-phone-back>Back</button>
          <div class="phone-title" data-phone-title>Phone</div>
          <button type="button" class="phone-header-button" data-phone-close>Close</button>
        </header>
        <div class="phone-screen" data-phone-screen></div>
        <footer class="phone-home-indicator" aria-hidden="true"></footer>
      </div>
    </section>
    <div class="controls" aria-hidden="true">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move&nbsp;&nbsp;<kbd>E</kbd> / <kbd>Space</kbd> Action&nbsp;&nbsp;<kbd>F</kbd> Phone
    </div>
    <noscript>このゲームを実行するにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
